<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EFA79B" /> <!-- Mejora Lighthouse PWA -->

    <!-- Título SEO (Bajo los 60 caracteres, ideal para no ser recortado) -->
    <title>Carysa | Boutique Femenina - Moda y Tendencias para Mujer</title>

    <!-- Meta Descripción (Entre 140 y 160 caracteres con llamadas a la acción) -->
    <meta
      name="description"
      content="Descubre la última colección de ropa para mujer en Carysa Boutique. Blusas, casacas, vestidos y prendas exclusivas con envíos rápidos a todo el Perú."
    />
    <meta
      name="keywords"
      content="boutique femenina, ropa para mujer, blusas, casacas, moda peruana, carysa"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://carysa-app.pe/" />

    <!-- Favicon e Iconos móviles (Mejora experiencia de usuario y Lighthouse) -->
    <link rel="icon" type="image/png" href="/logo_2.png" />
    <link rel="apple-touch-icon" href="/logo_2.png" />

    <!-- Open Graph (WhatsApp, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://carysa-app.pe/" />
    <meta property="og:title" content="Carysa | Boutique Femenina - Moda para Mujer" />
    <meta
      property="og:description"
      content="Encuentra blusas, casacas y vestidos exclusivos en Carysa Boutique. Envíos rápidos a todo el país."
    />
    <meta property="og:image" content="https://carysa-app.pe/logo_2.png" />
    <meta property="og:locale" content="es_PE" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Carysa | Boutique Femenina" />
    <meta
      name="twitter:description"
      content="Explora ropa femenina elegante y moderna en Carysa Boutique."
    />
    <meta name="twitter:image" content="https://carysa-app.pe/logo_2.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
